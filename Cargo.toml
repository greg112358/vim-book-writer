[package]
name = "book-writing-app"
version = "0.1.0"
edition = "2024"

[dependencies]
accesskit = "0.25"
accesskit_winit = "0.34"
arboard = "3"
cosmic-text = { version = "0.19", features = ["vi"] }
glyphon = "0.12"
ignore = "0.4"
jotdown = "0.10.0"
muda = { version = "0.20", optional = true }
notify = "8"
nucleo = "0.5"
png = "0.18"
pollster = "0.4"
printpdf = { version = "0.12", default-features = false }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
taffy = "0.14"
toml = "1"
wgpu = "30"
winit = "0.30"

[features]
# Native menu bar. On Linux this needs GTK3 dev packages (gtk3-devel).
native-menu = ["dep:muda"]

# Configuration for `cargo packager`. Run `cargo packager --release` on each platform to build its
# packages: an app bundle and disk image on macOS, and deb, AppImage, and pacman packages on Linux.
[package.metadata.packager]
product-name = "Book Writing App"
identifier = "com.bookwritingapp.editor"
description = "A fast, lightweight word processor for djot, with vim controls"
long-description = """
Write books in djot with vim controls. Normal mode shows the finished text, and insert mode shows
the source with its syntax dimmed. Export to Markdown or PDF."""
authors = ["Gregory"]
category = "Productivity"
out-dir = "target/packages"
binaries-dir = "target/release"
before-packaging-command = "cargo build --release"
icons = [
    "packaging/icons/32x32.png",
    "packaging/icons/128x128.png",
    "packaging/icons/256x256.png",
    "packaging/icons/512x512.png",
]

[[package.metadata.packager.binaries]]
path = "book-writing-app"
main = true

[[package.metadata.packager.file-associations]]
extensions = ["dj", "djot"]
mime-type = "text/x-djot"
description = "Djot document"

[package.metadata.packager.deb]
depends = ["libvulkan1"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
