[package]
name = "book-writing-app"
version = "0.1.0"
edition = "2024"

[dependencies]
accesskit = "0.25"
accesskit_winit = "0.34"
arboard = "3"
cosmic-text = { version = "0.19", features = ["vi"] }
glyphon = "0.12"
ignore = "0.4"
muda = { version = "0.20", optional = true }
notify = "8"
nucleo = "0.5"
pollster = "0.4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
taffy = "0.14"
toml = "1"
wgpu = "30"
winit = "0.30"

[features]
# Native menu bar. On Linux this needs GTK3 dev packages (gtk3-devel).
native-menu = ["dep:muda"]
